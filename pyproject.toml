[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "veros"
version = "0.1.0"
description = "Smart contract security scan pipeline: Slither scan, triage, delivery report"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
# The excluded version is the point: fpdf2 2.8.7 has the font-subsetting bug in
# references/pitfalls.md #6, which silently draws wrong glyphs on the cover of a
# multi-page report — no exception, just a corrupt PDF. 2.8.8 fixes it and 2.8.4
# predates it (verified on this pipeline's own fixtures). Pinning >=2.8.8
# instead would have been simpler and wrong: it needs Python 3.10, so on the
# 3.9 that ships with macOS pip cannot satisfy the package at all.
# matplotlib draws the severity chart. Slither and Foundry are NOT declared:
# they are external binaries the project under audit needs, not Python
# dependencies of this package, and `veros doctor` reports on them.
dependencies = [
    "fpdf2>=2.8.4,!=2.8.7",
    "matplotlib",
    # `veros triage` only. Everything else runs without it, so the import sits
    # inside the command rather than at module load — a report-only user who
    # never touches the AI step should not need a working SDK install.
    "anthropic>=0.40",
]

[project.scripts]
veros = "veros.cli:main"

[tool.setuptools]
packages = ["veros"]

[tool.setuptools.package-data]
# The methodology ships with the code. references/logic_scan.md is the scenario
# library Step 2 works through, severity_grading.md the grading standard,
# pitfalls.md the accumulated field notes, domain_incidents/ the per-domain
# incident research — and SKILL.md is what drives an LLM through the whole
# thing. A pip install without them leaves the deterministic half of the
# pipeline and none of the judgement, which is the half that matters.
# assets/ is here for the same reason: the cover page, the BSOS logo and the
# gradient rule are optional at render time, so leaving them out of the wheel
# produced a report that looked plausible and carried none of the branding.
# The repo root keeps symlinks to SKILL.md and references/ so the Claude Code
# skill layout, which requires SKILL.md at the skill root, still resolves.
veros = ["SKILL.md", "references/*.md", "references/**/*.md", "assets/*.png"]
